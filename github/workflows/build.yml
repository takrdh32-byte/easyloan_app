name: Build EasyLoan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 17 (required for Gradle 7+)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Set up Flutter (stable, pinned version)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      # 4. Show Flutter version (helpful for debugging)
      - name: Flutter version
        run: flutter --version

      # 5. Clean previous builds
      - name: Flutter clean
        run: flutter clean

      # 6. Get dependencies
      - name: Flutter pub get
        run: flutter pub get

      # 7. Analyze code (warnings only, don't fail)
      - name: Flutter analyze
        run: flutter analyze --no-fatal-warnings || true

      # 8. Build release APK
      - name: Build APK
        run: flutter build apk --release --no-shrink

      # 9. Upload APK as artifact (download from Actions tab)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EasyLoan-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # 10. Show APK size
      - name: APK size
        run: ls -lh build/app/outputs/flutter-apk/app-release.apk
