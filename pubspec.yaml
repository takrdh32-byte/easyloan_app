name: easyloan
description: EasyLoan - Fast & Easy Loans for Everyone
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase Core
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.10
  firebase_crashlytics: ^3.4.9
  firebase_analytics: ^10.8.0

  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.4.9

  # UI Components
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^2.7.0
  fl_chart: ^0.65.0
  flutter_spinkit: ^5.2.0
  smooth_page_indicator: ^1.1.0

  # Permissions
  permission_handler: ^11.2.0

  # Camera & ML Kit
  camera: ^0.10.5+9
  google_mlkit_face_detection: ^0.9.0

  # Storage & Files
  path_provider: ^2.1.2
  pdf: ^3.10.7
  printing: ^5.12.0
  open_file: ^3.3.2

  # Encryption
  encrypt: ^5.0.1
  crypto: ^3.0.3

  # Location
  geolocator: ^10.1.0

  # Contacts
  contacts_service: ^0.6.3

  # Razorpay
  razorpay_flutter: ^1.3.6

  # Network & Utils
  dio: ^5.4.0
  connectivity_plus: ^5.0.2
  shared_preferences: ^2.2.2
  local_auth: ^2.2.0
  image_picker: ^1.0.7
  intl: ^0.19.0
  uuid: ^4.3.3
  qr_flutter: ^4.1.0
  url_launcher: ^6.2.4
  package_info_plus: ^5.0.1
  device_info_plus: ^9.1.2
  haptic_feedback: ^0.1.0+2
  flutter_local_notifications: ^16.3.0
  workmanager: ^0.5.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Environment
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/fonts/
    - .env

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700